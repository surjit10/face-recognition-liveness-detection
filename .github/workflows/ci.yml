name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install frozen runtime and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock
          python -m pip install pytest==9.0.1
      - name: Verify installed requirements
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Scan tracked artifacts and credentials
        run: python scripts/scan_artifacts.py
