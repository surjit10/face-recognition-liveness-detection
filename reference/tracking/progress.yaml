    change: "Improved fail-closed presentation semantics and face-localized overlays. A below-threshold PAD result now displays LIVENESS NOT CONFIRMED instead of claiming a confirmed spoof. Valid detector boxes are carried only in memory: a single accepted face receives its verified local label, while multi-face scenes receive numbered IDENTITY NOT CHECKED boxes and never invoke recognition. Structured events continue to exclude all boxes. Verification: 127 automated tests and pip check pass; a synthetic real-window multi-face overlay smoke test rendered successfully without camera access or biometric data. No completion counts changed."
